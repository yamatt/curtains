---
name: Test Page Build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test.yaml"
      - "src/html/*"
      - "src/js/*"
      - "webpack.config.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-deploy-page:
    name: Build and Deploy page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Build
        run: |
          npm ci
          npm run build
